version: "3.8"

services:
  app:
    container_name: teacher2025_app
    build: .
    ports:
      - "8084:443"
    volumes:
      # Use 'cached' for better read performance on Windows
      - .:/var/www/html:cached
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-speed.ini:ro
      - ./docker/apache.conf:/etc/apache2/conf-enabled/zz-speed.conf:ro
    environment:
      # Database connection settings for CodeIgniter
      DB_HOST: skj2025_db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 8.8.4.4
      - 1.0.0.1
    networks:
      - skj2025_default
    # Improve container performance with RAM-based storage (tmpfs)
    tmpfs:
      - /tmp:size=256M
      - /var/cache:size=128M
      - /var/www/html/writable/session:size=64M,mode=1777
      - /var/www/html/writable/cache:size=64M,mode=1777

networks:
  skj2025_default:
    external: true


