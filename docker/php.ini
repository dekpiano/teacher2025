; ========================================================
; High Performance PHP Tuning for Docker on Windows
; ========================================================

; Realpath Cache (Caches file paths to eliminate Windows mount disk overhead)
realpath_cache_size = 16M
realpath_cache_ttl = 1800

; OPcache High Performance
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.enable_file_override = 1
opcache.file_cache = /tmp/opcache

; PHP 8.3 JIT Compiler (Compiles PHP code to native machine code)
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Output Buffering & Compression
output_buffering = 4096
zlib.output_compression = On
zlib.output_compression_level = 5

; Memory & Execution
memory_limit = 512M
max_execution_time = 300
post_max_size = 100M
upload_max_filesize = 100M
