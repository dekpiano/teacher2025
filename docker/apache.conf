# ========================================================
# High Performance Apache Configuration
# ========================================================

# Enable KeepAlive to reuse TCP connections for assets and API calls
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Enable Gzip/Deflate compression for text, scripts, JSON and styles
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
    AddOutputFilterByType DEFLATE application/x-javascript application/javascript application/json
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>
